# On every push to main, changesets/action either opens/updates the Version PR
# (when there are pending changesets) or, once that PR is merged, publishes to npm and tags.
# npm trusts this exact file via Trusted Publishing, so no npm token is stored anywhere.
# This doesn't wait for ci.yml: branch protection must require CI on the Version PR.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # commit the Version PR branch and push tags
  pull-requests: write # open the Version PR
  id-token: write # lets GitHub prove to npm that this workflow is the publisher

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # changesets/action pushes via the GitHub API with its own token

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc # Node 26's bundled npm (>= 11.5) does the OIDC exchange
          registry-url: https://registry.npmjs.org
      - uses: nubjs/setup-nub@8c7bade1432a9acf9a7ad169aa7288713d046161 # v0.6.2
        with:
          provision-node: false # setup-node above already reads .nvmrc
          nub-version: 0.11.2 # exact: the action downloads this binary unverified; bump by hand
          cache: false # skips setup-nub's nested actions/cache@v4, a movable tag
      - run: nub install --frozen-lockfile

      - run: nub run check
      - run: nub run typecheck
      - run: nub run test:ci
      - run: nub run build
      - run: nub run publint
      - run: nub run attw

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: nub run release
