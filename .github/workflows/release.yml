# On every push to main, changesets/action either opens/updates the Version PR
# (when there are pending changesets) or, once that PR is merged, publishes to npm and tags.
# npm trusts this exact file via Trusted Publishing, so no npm token is stored anywhere.
# This doesn't wait for ci.yml: branch protection must require CI on the Version PR.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # commit the Version PR branch and push tags
  pull-requests: write # open the Version PR
  id-token: write # lets GitHub prove to npm that this workflow is the publisher

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc # Node 26's bundled npm (>= 11.5) does the OIDC exchange
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - run: bun run check
      - run: bun run typecheck
      - run: bun run test:ci
      - run: bun run build
      - run: bun run publint
      - run: bun run attw

      - uses: changesets/action@v2
        with:
          publish-script: bun run release
