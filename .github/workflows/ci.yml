name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: nubjs/setup-nub@8c7bade1432a9acf9a7ad169aa7288713d046161 # v0.6.2
        with:
          node-version-file: .nvmrc
      - run: nub install --frozen-lockfile
      - run: nub run check
      - run: nub run typecheck
      # Fails on "excessively deep" or when the Plugin fixture's instantiations exceed the budget (#175).
      - run: nub run typecheck:budget
      - run: nub run build
      - run: nub run publint
      - run: nub run attw

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: nubjs/setup-nub@8c7bade1432a9acf9a7ad169aa7288713d046161 # v0.6.2
        with:
          node-version-file: .nvmrc
      - run: nub install --frozen-lockfile
      - if: matrix.runtime == 'node'
        run: nub run test:ci
      # Bun is only the runtime under test here, not the tooling.
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # --bun runs vitest itself on Bun's runtime instead of Node.
      - if: matrix.runtime == 'bun'
        run: bun --bun vitest run --project unit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FASTI_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: nubjs/setup-nub@8c7bade1432a9acf9a7ad169aa7288713d046161 # v0.6.2
        with:
          node-version-file: .nvmrc
      - run: nub install --frozen-lockfile
      - run: nub run test:integration
      - run: nub run build
      # The examples install the built package (file:../..) and run against the same Postgres.
      - name: examples/basic
        working-directory: examples/basic
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          nub install
          nub run typecheck
          nub run migrate
          nub run plain
          nub run effect
